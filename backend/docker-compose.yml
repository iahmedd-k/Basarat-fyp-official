x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    container_name: basarat-redis
    command: redis-server --appendonly yes
    volumes:
      - basarat-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: basarat-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    user: "0:0"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CLOUD_REDIS_URL: ${CLOUD_REDIS_URL:-}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
    restart: unless-stopped
    logging: *default-logging

  celery-worker:
    build:
      context: .
      dockerfile: dockerfile
    container_name: basarat-celery-worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    user: "0:0"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CLOUD_REDIS_URL: ${CLOUD_REDIS_URL:-}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  celery-beat:
    build:
      context: .
      dockerfile: dockerfile
    container_name: basarat-celery-beat
    command: celery -A app.celery_app beat --loglevel=info
    user: "0:0"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CLOUD_REDIS_URL: ${CLOUD_REDIS_URL:-}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

volumes:
  basarat-redis-data:
