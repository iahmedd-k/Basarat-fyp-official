services:
  migrate:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the published ARM64 image}
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CLOUD_DATABASE_URL: ${CLOUD_DATABASE_URL:?Set CLOUD_DATABASE_URL in .env}
      DATABASE_URL: ${CLOUD_DATABASE_URL:?Set CLOUD_DATABASE_URL in .env}
      DATABASE_URL_SYNC: ""
      CLOUD_REDIS_URL: ""
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://ahmed-khaan.vercel.app"]}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["193.123.84.223","127.0.0.1","localhost","app"]}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      REDIS_ENABLED: "true"
      USE_CELERY: "true"
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"

  app:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the published ARM64 image}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CLOUD_DATABASE_URL: ${CLOUD_DATABASE_URL:?Set CLOUD_DATABASE_URL in .env}
      DATABASE_URL: ${CLOUD_DATABASE_URL:?Set CLOUD_DATABASE_URL in .env}
      DATABASE_URL_SYNC: ""
      CLOUD_REDIS_URL: ""
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      REDIS_ENABLED: "true"
      USE_CELERY: "true"
      FIREBASE_ENABLED: "true"
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-admin.json
    ports:
      - "8000:8000"
    volumes:
      - market-data:/app/data/raw/ohlcv
      - feature-data:/app/data/features
      - training-reports:/app/data/reports
      - type: bind
        source: ${FIREBASE_CREDENTIALS_HOST_PATH:-./secrets}
        target: /run/secrets
        read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    mem_limit: 2g
    restart: unless-stopped

  celery-worker:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the published ARM64 image}
    command: celery -A app.celery_app worker --loglevel=info --queues=health,default,market-live,news,fundamentals,ml-training,data-pipeline --concurrency=1 --max-tasks-per-child=20
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CLOUD_DATABASE_URL: ${CLOUD_DATABASE_URL:?Set CLOUD_DATABASE_URL in .env}
      DATABASE_URL: ${CLOUD_DATABASE_URL:?Set CLOUD_DATABASE_URL in .env}
      DATABASE_URL_SYNC: ""
      CLOUD_REDIS_URL: ""
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      REDIS_ENABLED: "true"
      USE_CELERY: "true"
      FIREBASE_ENABLED: "true"
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-admin.json
    volumes:
      - market-data:/app/data/raw/ohlcv
      - feature-data:/app/data/features
      - training-reports:/app/data/reports
      - type: bind
        source: ${FIREBASE_CREDENTIALS_HOST_PATH:-./secrets}
        target: /run/secrets
        read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f celery >/dev/null || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 2g
    stop_grace_period: 2m
    restart: unless-stopped

  celery-beat:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the published ARM64 image}
    command: celery -A app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CLOUD_DATABASE_URL: ${CLOUD_DATABASE_URL:?Set CLOUD_DATABASE_URL in .env}
      DATABASE_URL: ${CLOUD_DATABASE_URL:?Set CLOUD_DATABASE_URL in .env}
      DATABASE_URL_SYNC: ""
      CLOUD_REDIS_URL: ""
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      REDIS_ENABLED: "true"
      USE_CELERY: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f celery >/dev/null || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 384mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    restart: unless-stopped

volumes:
  market-data:
  feature-data:
  training-reports:
  beat-state:
  redis-data:
