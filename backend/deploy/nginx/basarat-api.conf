map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=api_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

upstream basarat_api_active {
    least_conn;
    include /etc/nginx/basarat-upstreams/active.conf;
    keepalive 32;
}

server {
    listen 8000 default_server;
    listen [::]:8000 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_req zone=api_req burst=50 nodelay;
    limit_conn api_conn 20;

    location / {
        proxy_pass http://basarat_api_active;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
