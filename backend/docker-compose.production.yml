services:
  # Uses the managed Supabase and Upstash URLs provided by backend/.env.
  migrate:
    image: basarat-backend:latest
    build: { context: ., dockerfile: Dockerfile }
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: ${CLOUD_DATABASE_URL:?Set CLOUD_DATABASE_URL in backend/.env}
      DATABASE_URL_SYNC: ""
    restart: "no"

  app:
    image: basarat-backend:latest
    build: { context: ., dockerfile: Dockerfile }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    env_file: .env
    environment:
      DATABASE_URL: ${CLOUD_DATABASE_URL:?Set CLOUD_DATABASE_URL in backend/.env}
      DATABASE_URL_SYNC: ""
    volumes:
      - market-data:/app/data/raw/ohlcv
      - feature-data:/app/data/features
      - gru-candidates:/app/models/gru_candidate
      - xgb-candidates:/app/models/xgb_candidate
      - training-reports:/app/data/reports
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  celery-worker:
    image: basarat-backend:latest
    build: { context: ., dockerfile: Dockerfile }
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 --max-tasks-per-child=1
    env_file: .env
    environment:
      DATABASE_URL: ${CLOUD_DATABASE_URL:?Set CLOUD_DATABASE_URL in backend/.env}
      DATABASE_URL_SYNC: ""
    volumes:
      - market-data:/app/data/raw/ohlcv
      - feature-data:/app/data/features
      - gru-candidates:/app/models/gru_candidate
      - xgb-candidates:/app/models/xgb_candidate
      - training-reports:/app/data/reports
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  celery-beat:
    image: basarat-backend:latest
    build: { context: ., dockerfile: Dockerfile }
    command: celery -A app.celery_app beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule
    volumes:
      - beat-state:/var/lib/celery
    env_file: .env
    environment:
      DATABASE_URL: ${CLOUD_DATABASE_URL:?Set CLOUD_DATABASE_URL in backend/.env}
      DATABASE_URL_SYNC: ""
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  market-data:
  feature-data:
  gru-candidates:
  xgb-candidates:

  beat-state:
  training-reports:
