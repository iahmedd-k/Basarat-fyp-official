# Production stack.
#
# Redis note: the cache/broker/result URLs are taken from backend/.env via
# ${REDIS_URL:-redis://redis:6379/0}. The `redis` service below is only a
# fallback for when REDIS_URL is unset, so an externally managed Redis
# (ElastiCache/Upstash) is used as-is instead of being silently overridden.
# Every service -- including `migrate` -- resolves the same URLs so there is
# never a second, divergent Redis identity in production.
x-redis-env: &redis-env
  REDIS_ENABLED: ${REDIS_ENABLED:-true}
  USE_CELERY: ${USE_CELERY:-true}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}

x-app-env: &app-env
  DATABASE_URL: ${CLOUD_DATABASE_URL:?Set CLOUD_DATABASE_URL in backend/.env}
  DATABASE_URL_SYNC: ""

x-data-volumes: &data-volumes
  - market-data:/app/data/raw/ohlcv
  - feature-data:/app/data/features
  - runtime-state:/app/data/news_state
  - symbol-config:/app/data/config
  - gru-candidates:/app/models/gru_candidate
  - xgb-candidates:/app/models/xgb_candidate
  - training-reports:/app/data/reports

services:
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      # Bound the cache so a large board snapshot can never OOM the container.
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: basarat-backend:latest
    build: { context: ., dockerfile: Dockerfile }
    command: alembic upgrade head
    env_file: .env
    environment:
      <<: [*app-env, *redis-env]
    volumes: *data-volumes
    restart: "no"

  app:
    image: basarat-backend:latest
    build: { context: ., dockerfile: Dockerfile }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    env_file: .env
    environment:
      <<: [*app-env, *redis-env]
    volumes: *data-volumes
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # Without this the container is "running" while uvicorn is dead, and the
    # deploy health check passes against nothing.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  celery-worker:
    image: basarat-backend:latest
    build: { context: ., dockerfile: Dockerfile }
    # --concurrency=1 with --max-tasks-per-child=1 recycles the child after every
    # single task. Combined with prefork that repeatedly re-imports the app and
    # drops the warm market cache connection. A modest pool and a long child
    # lifetime keep the scraper responsive without thrashing.
    command: >
      celery -A app.celery_app worker
      --loglevel=info
      --concurrency=2
      --max-tasks-per-child=200
      --without-gossip --without-mingle
    env_file: .env
    environment:
      <<: [*app-env, *redis-env]
    volumes: *data-volumes
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  celery-beat:
    image: basarat-backend:latest
    build: { context: ., dockerfile: Dockerfile }
    command: >
      celery -A app.celery_app beat
      --loglevel=info
      --schedule=/var/lib/celery/celerybeat-schedule
    env_file: .env
    environment:
      <<: [*app-env, *redis-env]
    volumes:
      - beat-state:/var/lib/celery
      - runtime-state:/app/data/news_state
      - symbol-config:/app/data/config
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  market-data:
  feature-data:
  gru-candidates:
  xgb-candidates:
  training-reports:
  redis-data:
  # Runtime state that must survive a rebuild; never baked into the image.
  runtime-state:
  # Scraped index membership, rewritten by the weekly constituents refresh.
  symbol-config:
  beat-state:
