name: Backend CI and Oracle ARM64 deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.oracle.yml"
      - ".github/workflows/deploy-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: basarat-oracle-production
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/iahmedd-k/basarat-backend

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: oracle-production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest pytest-asyncio aiosqlite "xgboost>=2,<4"

      - name: Compile backend modules
        run: python -m compileall -q backend/app

      - name: Validate Alembic migration graph
        working-directory: backend
        run: test "$(python -m alembic heads | wc -l)" -eq 1

      - name: Run backend unit tests
        working-directory: backend
        env:
          ENVIRONMENT: test
          SECRET_KEY: local-ci-only-signing-key-at-least-32-chars
          DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/ci
          REDIS_ENABLED: "false"
          USE_CELERY: "false"
        run: python -m pytest -c pytest.ini tests/unit -q

      - name: Validate Oracle Compose configuration
        env:
          BACKEND_IMAGE: ghcr.io/iahmedd-k/basarat-backend:validation
          CLOUD_DATABASE_URL: postgresql+asyncpg://ci:ci@database.invalid:5432/ci
          SECRET_KEY: local-ci-only-signing-key-at-least-32-chars
          CORS_ORIGINS: '["https://app.example.com"]'
          ALLOWED_HOSTS: '["193.123.84.223"]'
          PROMETHEUS_METRICS_USERNAME: validation-user
          PROMETHEUS_METRICS_PASSWORD: 0123456789abcdef0123456789abcdef
          PROMETHEUS_METRICS_HOST_HEADER: 193.123.84.223
          GRAFANA_ADMIN_PASSWORD: 0123456789abcdef0123456789abcdef
        run: |
          touch backend/.env
          docker compose \
            -f backend/docker-compose.oracle.yml \
            -f backend/docker-compose.monitoring.yml \
            config --quiet

      - name: Verify Oracle deployment secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          ORACLE_GHCR_TOKEN: ${{ secrets.ORACLE_GHCR_TOKEN }}
          PROMETHEUS_METRICS_USERNAME: ${{ secrets.PROMETHEUS_METRICS_USERNAME }}
          PROMETHEUS_METRICS_PASSWORD: ${{ secrets.PROMETHEUS_METRICS_PASSWORD }}
          PROMETHEUS_METRICS_HOST_HEADER: ${{ secrets.PROMETHEUS_METRICS_HOST_HEADER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          for name in ORACLE_HOST ORACLE_USER ORACLE_SSH_PRIVATE_KEY ORACLE_SSH_KNOWN_HOSTS ORACLE_GHCR_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the $name secret in the oracle-production environment."
              exit 1
            fi
          done
          for name in PROMETHEUS_METRICS_USERNAME PROMETHEUS_METRICS_PASSWORD PROMETHEUS_METRICS_HOST_HEADER GRAFANA_ADMIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the $name secret in the oracle-production environment."
              exit 1
            fi
          done
          if [[ ! "$PROMETHEUS_METRICS_USERNAME" =~ ^[A-Za-z0-9_.-]{1,64}$ ]]; then
            echo "::error::PROMETHEUS_METRICS_USERNAME must be 1-64 characters using only letters, numbers, dots, underscores, or hyphens (for example: metrics_reader)."
            exit 1
          fi
          for name in PROMETHEUS_METRICS_PASSWORD GRAFANA_ADMIN_PASSWORD; do
            if [[ ! "${!name}" =~ ^[A-Fa-f0-9]{32,128}$ ]]; then
              echo "::error::$name must be 32-128 hexadecimal characters."
              exit 1
            fi
          done
          if [[ ! "$PROMETHEUS_METRICS_HOST_HEADER" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::PROMETHEUS_METRICS_HOST_HEADER must be a hostname or IP without a port."
            exit 1
          fi

      - name: Set immutable image tag
        id: image
        run: echo "tag=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=basarat-backend-arm64
          cache-to: type=gha,mode=max,scope=basarat-backend-arm64

      - name: Configure SSH
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > "$HOME/.ssh/oracle_deploy"
          chmod 0600 "$HOME/.ssh/oracle_deploy"
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Prepare Oracle deployment directory
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh -i "$HOME/.ssh/oracle_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$ORACLE_USER@$ORACLE_HOST" \
            'command -v docker >/dev/null && docker compose version >/dev/null && mkdir -p "$HOME/basarat/secrets" "$HOME/basarat/monitoring/grafana/provisioning/datasources" "$HOME/basarat/monitoring/grafana/provisioning/dashboards" "$HOME/basarat/monitoring/grafana/dashboards" && chmod 0755 "$HOME/basarat/secrets" && (test ! -f "$HOME/basarat/secrets/firebase-admin.json" || chmod 0644 "$HOME/basarat/secrets/firebase-admin.json") && test -f "$HOME/basarat/.env"'

      - name: Upload Oracle application and monitoring configuration
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          PROMETHEUS_METRICS_USERNAME: ${{ secrets.PROMETHEUS_METRICS_USERNAME }}
          PROMETHEUS_METRICS_PASSWORD: ${{ secrets.PROMETHEUS_METRICS_PASSWORD }}
          PROMETHEUS_METRICS_HOST_HEADER: ${{ secrets.PROMETHEUS_METRICS_HOST_HEADER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          trap 'rm -f monitoring.env' EXIT
          umask 077
          printf '%s\n' \
            "PROMETHEUS_METRICS_USERNAME=$PROMETHEUS_METRICS_USERNAME" \
            "PROMETHEUS_METRICS_PASSWORD=$PROMETHEUS_METRICS_PASSWORD" \
            "PROMETHEUS_METRICS_HOST_HEADER=$PROMETHEUS_METRICS_HOST_HEADER" \
            "GRAFANA_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD" > monitoring.env
          chmod 0600 monitoring.env
          scp -i "$HOME/.ssh/oracle_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            backend/docker-compose.oracle.yml \
            "$ORACLE_USER@$ORACLE_HOST:basarat/docker-compose.yml"
          scp -i "$HOME/.ssh/oracle_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            backend/docker-compose.monitoring.yml \
            "$ORACLE_USER@$ORACLE_HOST:basarat/docker-compose.monitoring.yml"
          scp -i "$HOME/.ssh/oracle_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            backend/monitoring/prometheus.yml \
            "$ORACLE_USER@$ORACLE_HOST:basarat/monitoring/prometheus.yml"
          scp -i "$HOME/.ssh/oracle_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            backend/monitoring/grafana/provisioning/datasources/prometheus.yml \
            "$ORACLE_USER@$ORACLE_HOST:basarat/monitoring/grafana/provisioning/datasources/prometheus.yml"
          scp -i "$HOME/.ssh/oracle_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            backend/monitoring/grafana/provisioning/dashboards/basarat.yml \
            "$ORACLE_USER@$ORACLE_HOST:basarat/monitoring/grafana/provisioning/dashboards/basarat.yml"
          scp -i "$HOME/.ssh/oracle_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            backend/monitoring/grafana/dashboards/api-overview.json \
            "$ORACLE_USER@$ORACLE_HOST:basarat/monitoring/grafana/dashboards/api-overview.json"
          cat monitoring.env \
            | ssh -i "$HOME/.ssh/oracle_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$ORACLE_USER@$ORACLE_HOST" \
                'cd "$HOME/basarat" && umask 077 && cat > .env.monitoring.next && chmod 0600 .env.monitoring.next && mv -f .env.monitoring.next .env.monitoring'

      - name: Pull and deploy immutable image
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_GHCR_TOKEN: ${{ secrets.ORACLE_GHCR_TOKEN }}
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          printf '%s' "$ORACLE_GHCR_TOKEN" \
            | ssh -i "$HOME/.ssh/oracle_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$ORACLE_USER@$ORACLE_HOST" \
                "docker login ghcr.io --username iahmedd-k --password-stdin"
          ssh -i "$HOME/.ssh/oracle_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$ORACLE_USER@$ORACLE_HOST" \
            "cd \"\$HOME/basarat\" && COMPOSE='docker compose --env-file .env --env-file .env.monitoring -f docker-compose.yml -f docker-compose.monitoring.yml' && BACKEND_IMAGE='$IMAGE' \$COMPOSE pull && BACKEND_IMAGE='$IMAGE' \$COMPOSE stop app celery-worker celery-beat migrate || true && BACKEND_IMAGE='$IMAGE' \$COMPOSE rm -f -s app celery-worker celery-beat migrate || true && docker container prune -f || true && BACKEND_IMAGE='$IMAGE' \$COMPOSE up -d --remove-orphans --wait --wait-timeout 300 && \$COMPOSE ps"
