name: Deploy to Basarat EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basarat-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, basarat-demo]
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Copy app files to EC2 deployment directory
        run: rsync -a --exclude='.git/' --exclude='.env' "$GITHUB_WORKSPACE/" /opt/basarat/

      - name: Ensure Docker Compose is installed
        run: |
          if ! docker compose version >/dev/null 2>&1; then
            mkdir -p "$HOME/.docker/cli-plugins"
            curl -fsSL https://github.com/docker/compose/releases/download/v5.5.0/docker-compose-linux-x86_64 -o "$HOME/.docker/cli-plugins/docker-compose"
            chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          fi
          docker compose version

      - name: Ensure Buildx meets Compose requirements
        run: |
          if ! docker buildx version 2>/dev/null | grep -Eq 'v0\.(1[7-9]|[2-9][0-9])'; then
            mkdir -p "$HOME/.docker/cli-plugins"
            curl -fsSL https://github.com/docker/buildx/releases/download/v0.37.1/buildx-v0.37.1.linux-amd64 -o "$HOME/.docker/cli-plugins/docker-buildx"
            echo "9447199cdb435f25880548343c128a4b6650e8891ee598905d8d29d39a8e359b  $HOME/.docker/cli-plugins/docker-buildx" | sha256sum -c -
            chmod +x "$HOME/.docker/cli-plugins/docker-buildx"
          fi
          docker buildx version

      - name: Deploy Compose stack
        working-directory: /opt/basarat/backend
        run: |
          test -s .env || { echo "Missing /opt/basarat/backend/.env; configure it on EC2 before deploying."; exit 1; }
          docker compose -f docker-compose.production.yml config --quiet
          docker compose --parallel 1 -f docker-compose.production.yml up -d --build
          docker compose -f docker-compose.production.yml ps
          if ! curl --fail --retry 12 --retry-delay 5 --retry-connrefused --retry-all-errors http://127.0.0.1:8000/health; then
            echo "API health check failed; reporting container state for diagnosis."
            docker compose -f docker-compose.production.yml ps --all
            app_container=$(docker compose -f docker-compose.production.yml ps --all -q app | head -n 1)
            if [ -n "$app_container" ]; then
              docker inspect --format 'app status={{.State.Status}} exit_code={{.State.ExitCode}} oom_killed={{.State.OOMKilled}} restart_count={{.RestartCount}}' "$app_container"
            fi
            exit 1
          fi
