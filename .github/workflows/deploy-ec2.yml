name: Backend CI and EC2 API deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basarat-production
  cancel-in-progress: false

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install locked runtime dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r backend/requirements.lock

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-asyncio aiosqlite

      - name: Compile backend modules
        run: python -m compileall -q backend/app

      - name: Validate Alembic migration graph
        working-directory: backend
        run: test "$(python -m alembic heads | wc -l)" -eq 1

      - name: Run backend API and unit tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: local-ci-only-signing-key-at-least-32-chars
          DATABASE_URL: postgresql+asyncpg://ci:ci@ci-db.invalid:5432/test_only
          DATABASE_URL_SYNC: postgresql+psycopg2://ci:ci@ci-db.invalid:5432/test_only
          REDIS_ENABLED: "false"
          USE_CELERY: "false"
          TESTING: "true"
        run: python -m pytest -c backend/pytest.ini backend/tests/api backend/tests/unit -q

      - name: Validate production Compose and deploy scripts
        run: |
          for script in backend/deploy/ec2/*.sh; do bash -n "$script"; done
          validation_dir="$(mktemp -d)"
          trap 'rm -rf "$validation_dir"' EXIT
          cp backend/docker-compose.production.yml "$validation_dir/docker-compose.yml"
          touch "$validation_dir/.env"
          BACKEND_IMAGE=ci.invalid/basarat/backend:validation \
          CLOUD_DATABASE_URL=postgresql+asyncpg://ci:ci@ci-db.invalid:5432/test_only \
            docker compose --project-directory "$validation_dir" \
              -f "$validation_dir/docker-compose.yml" config --quiet

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set immutable image URI
        id: image
        shell: bash
        run: |
          : "${ECR_REPOSITORY:?Set repository variable ECR_REPOSITORY}"
          echo "uri=${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: true
          tags: ${{ steps.image.outputs.uri }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}
          cache-from: type=gha,scope=basarat-backend
          cache-to: type=gha,mode=max,scope=basarat-backend

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: basarat-deploy-bundle
          path: |
            backend/docker-compose.production.yml
            backend/deploy/ec2/*.sh
            backend/deploy/nginx/*.conf
            backend/deploy/nginx/*.logrotate
          if-no-files-found: error
          retention-days: 7

  deploy-api:
    needs: test-build-push
    runs-on: [self-hosted, linux, x64, basarat-demo]
    timeout-minutes: 180
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_URI: ${{ needs.test-build-push.outputs.image_uri }}
    steps:
      - name: Download deployment bundle
        uses: actions/download-artifact@v4
        with:
          name: basarat-deploy-bundle
          path: deploy-bundle

      - name: Install deployment scripts on EC2
        run: |
          install -d -m 0750 /opt/basarat/deploy/ec2 /opt/basarat/deploy/nginx
          install -m 0640 deploy-bundle/docker-compose.production.yml /opt/basarat/backend/docker-compose.production.yml
          install -m 0750 deploy-bundle/deploy/ec2/*.sh /opt/basarat/deploy/ec2/
          install -m 0644 deploy-bundle/deploy/nginx/basarat-api.conf /opt/basarat/deploy/nginx/
          install -m 0644 deploy-bundle/deploy/nginx/basarat-nginx.logrotate /opt/basarat/deploy/nginx/

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Pull and deploy API image
        shell: bash
        run: |
          : "${AWS_REGION:?Set repository variable AWS_REGION}"
          : "${IMAGE_URI:?Build job did not publish an image URI}"
          registry="${IMAGE_URI%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"
          bash /opt/basarat/deploy/ec2/deploy-api.sh "$IMAGE_URI" "$GITHUB_SHA"
